name: Run Discord Bot 2 Every Odd Hour
on:
  schedule:
    - cron: '0 1-23/2 * * *' # Jalan jam 1,3,5,...23 UTC
  workflow_dispatch:
jobs:
  run-bot2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run script bot2
        env:
          TOKEN_AKUN: ${{ secrets.TOKEN_REDACTED  }}
          CHANNEL_ID: ${{ secrets.733050809314705458 }}
          SERVER_FORWARD_ID: ${{ secrets.1521338078407430158 }}
        run: python bot2.py
