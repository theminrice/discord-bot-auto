name: Run Discord Bot 2 Every Odd Hour

on:
  schedule:
    - cron: '0 1-23/2 * * *'
  workflow_dispatch:

concurrency:
  group: bot2-run
  cancel-in-progress: false

jobs:
  run-bot2:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install requests

      - name: Run script
        env:
          BOT2_TOKEN: ${{ secrets.BOT2_TOKEN }}
          CHANNEL_PROMOSI_1: ${{ secrets.CHANNEL_PROMOSI_1 }}
          CHANNEL_PROMOSI_2: ${{ secrets.CHANNEL_PROMOSI_2 }}
          SERVER_FORWARD_ID: ${{ secrets.SERVER_FORWARD_ID }}
        run: python bot2.py
