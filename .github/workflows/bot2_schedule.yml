name: Run Discord Bot Every 2 Hours

on:
  schedule:
    - cron: '0 */2 * * *' # Menjalankan script otomatis setiap kelipatan 2 jam murni
  workflow_dispatch: # Memunculkan tombol "Run workflow" agar bisa dites manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python bot2.py
