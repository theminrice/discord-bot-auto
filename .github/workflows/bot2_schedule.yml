name: Run Discord Bot 2 Every Odd Hour
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  run-bot2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run script bot2
        env:
          TOKEN_AKUN: ${{ secrets.BOT2_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SERVER_FORWARD_ID: ${{ secrets.FORWARD_ID }}
        run: python bot2.py
