name: Run Discord Bot Every 2 Hours
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        env:
          TOKEN_AKUN: ${{ secrets.TOKEN_REDACTED  }}
          CHANNEL_ID: ${{ secrets.733050809314705458 }}
          SERVER_FORWARD_ID: ${{ secrets.1521338078407430158 }}
        run: python bot.py
