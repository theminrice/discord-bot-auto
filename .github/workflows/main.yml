name: Run Discord Bot Every 2 Hours

on:
  schedule:
    - cron: '0 */2 * * *' # Berjalan otomatis setiap kelipatan 2 jam murni
  workflow_dispatch: # Fitur tombol agar Anda bisa mengetes jalannya bot secara manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python bot.py
