name: Run Discord Bot Every 2 Hours

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

concurrency:
  group: bot1-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          BOT1_TOKEN: ${{ secrets.BOT1_TOKEN }}
          CHANNEL_PROMOSI_1: ${{ secrets.CHANNEL_PROMOSI_1 }}
          CHANNEL_PROMOSI_2: ${{ secrets.CHANNEL_PROMOSI_2 }}
          SERVER_FORWARD_ID: ${{ secrets.SERVER_FORWARD_ID }}
        run: python bot.py
